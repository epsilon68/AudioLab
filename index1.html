<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Analogique → Numérique</title>
    <style>
        :root {
            --bg: #1e1e2f;
            --panel: #2a2a40;
            --text: #e0e0e0;
            --accent: #4fc3f7;
            --analog: #ffb74d;
            --digital: #81c784;
            --error: #e57373;
            --border: #444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        h1 {
            font-size: 1.4rem;
            margin: 10px 0;
            text-align: center;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: var(--panel);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #111;
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none; /* prevent scrolling while interacting */
        }
        .controls {
            width: 100%;
            max-width: 800px;
            background: var(--panel);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-group label span {
            font-weight: bold;
            color: var(--accent);
        }
        input[type="range"] {
            width: 100%;
            height: 40px;
            -webkit-appearance: none;
            background: transparent;
            margin-top: 5px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            background: #444;
            border-radius: 4px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -10px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        input[type="range"]::-moz-range-track {
            height: 8px;
            background: #444;
            border-radius: 4px;
        }
        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .checkbox-group input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--accent);
        }
        .info-text {
            font-size: 0.85rem;
            opacity: 0.8;
            text-align: center;
            margin-top: 5px;
        }
        @media (min-width: 600px) {
            h1 { font-size: 2rem; }
            .controls { padding: 20px; }
            input[type="range"] { height: 45px; }
        }
    </style>
</head>
<body>
    <h1>Conversion Analogique → Numérique</h1>

    <div class="canvas-container">
        <canvas id="signalCanvas" width="800" height="400"></canvas>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="freqSignal">Fréquence du signal analogique <span id="freqSignalValue">5 Hz</span></label>
            <input type="range" id="freqSignal" min="1" max="20" value="5" step="0.5">
        </div>
        <div class="control-group">
            <label for="amplitude">Amplitude <span id="amplitudeValue">1.0</span></label>
            <input type="range" id="amplitude" min="0.2" max="2.0" value="1.0" step="0.1">
        </div>
        <div class="control-group">
            <label for="samplingRate">Fréquence d'échantillonnage (Hz) <span id="samplingRateValue">20 Hz</span></label>
            <input type="range" id="samplingRate" min="1" max="100" value="20" step="1">
        </div>
        <div class="control-group">
            <label for="bitDepth">Quantification (bits) <span id="bitDepthValue">4 bits</span></label>
            <input type="range" id="bitDepth" min="1" max="10" value="4" step="1">
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="showAnalog" checked>
            <label for="showAnalog">Afficher signal analogique</label>
            <input type="checkbox" id="showSamples" checked style="margin-left: 15px;">
            <label for="showSamples">Afficher échantillons</label>
            <input type="checkbox" id="showDigital" checked style="margin-left: 15px;">
            <label for="showDigital">Afficher signal numérique</label>
            <input type="checkbox" id="showError" checked style="margin-left: 15px;">
            <label for="showError">Afficher erreur de quantification</label>
        </div>
        <p class="info-text">
            Signal analogique : courbe orange continue.<br>
            Échantillonnage : points bleus prélevés à la fréquence choisie.<br>
            Numérique : escalier vert (maintien) ou valeurs quantifiées.
        </p>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('signalCanvas');
            const ctx = canvas.getContext('2d');

            // Éléments de contrôle
            const freqSignalInput = document.getElementById('freqSignal');
            const amplitudeInput = document.getElementById('amplitude');
            const samplingRateInput = document.getElementById('samplingRate');
            const bitDepthInput = document.getElementById('bitDepth');
            const showAnalogCheck = document.getElementById('showAnalog');
            const showSamplesCheck = document.getElementById('showSamples');
            const showDigitalCheck = document.getElementById('showDigital');
            const showErrorCheck = document.getElementById('showError');

            // Affichage des valeurs
            const freqSignalValue = document.getElementById('freqSignalValue');
            const amplitudeValue = document.getElementById('amplitudeValue');
            const samplingRateValue = document.getElementById('samplingRateValue');
            const bitDepthValue = document.getElementById('bitDepthValue');

            // Paramètres actuels
            let freqSignal = 5;
            let amplitude = 1.0;
            let samplingRate = 20;
            let bitDepth = 4; // nombre de bits

            // Fonction pour mettre à jour les libellés
            function updateLabels() {
                freqSignalValue.textContent = freqSignal + ' Hz';
                amplitudeValue.textContent = amplitude.toFixed(1);
                samplingRateValue.textContent = samplingRate + ' Hz';
                bitDepthValue.textContent = bitDepth + ' bits';
            }

            // Lecture des contrôles
            function readControls() {
                freqSignal = parseFloat(freqSignalInput.value);
                amplitude = parseFloat(amplitudeInput.value);
                samplingRate = parseInt(samplingRateInput.value);
                bitDepth = parseInt(bitDepthInput.value);
                updateLabels();
                draw();
            }

            // Fonction de dessin principale
            function draw() {
                const width = canvas.width;
                const height = canvas.height;
                ctx.clearRect(0, 0, width, height);

                // Marges
                const marginX = 50;
                const marginY = 30;
                const plotWidth = width - 2 * marginX;
                const plotHeight = height - 2 * marginY;

                // Centre vertical = zéro
                const zeroY = marginY + plotHeight / 2;

                // Axe horizontal (t)
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(marginX, zeroY);
                ctx.lineTo(width - marginX, zeroY);
                ctx.stroke();

                // Axe vertical (amplitude)
                ctx.beginPath();
                ctx.moveTo(marginX, marginY);
                ctx.lineTo(marginX, height - marginY);
                ctx.stroke();

                // Graduations
                ctx.fillStyle = '#aaa';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                // Axe des temps : 0 à 1 seconde
                const duration = 1; // 1 seconde affichée
                for (let t = 0; t <= duration; t += 0.2) {
                    const x = marginX + t * plotWidth;
                    ctx.fillText(t.toFixed(1) + 's', x, zeroY + 20);
                }
                // Axe vertical : amplitude de -amplitude à +amplitude
                ctx.textAlign = 'right';
                for (let a = -amplitude; a <= amplitude; a += amplitude / 2) {
                    const y = zeroY - (a / amplitude) * (plotHeight / 2);
                    ctx.fillText(a.toFixed(1), marginX - 10, y + 4);
                }

                // Dessiner le signal analogique
                if (showAnalogCheck.checked) {
                    ctx.strokeStyle = '#ffb74d';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    const stepsPerPixel = 1;
                    for (let px = 0; px <= plotWidth; px += stepsPerPixel) {
                        const t = px / plotWidth * duration;
                        const value = amplitude * Math.sin(2 * Math.PI * freqSignal * t);
                        const x = marginX + px;
                        const y = zeroY - (value / amplitude) * (plotHeight / 2);
                        if (px === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }

                // Échantillonnage
                const numSamples = Math.floor(samplingRate * duration);
                const sampleInterval = duration / numSamples;
                const quantizationLevels = Math.pow(2, bitDepth);
                const stepSize = (2 * amplitude) / quantizationLevels;

                // Tableaux pour stocker les positions des échantillons et valeurs quantifiées
                const samplePoints = [];
                const quantizedPoints = [];

                // Dessiner les échantillons (points bleus)
                if (showSamplesCheck.checked) {
                    ctx.fillStyle = '#4fc3f7';
                    for (let i = 0; i < numSamples; i++) {
                        const t = i * sampleInterval;
                        const value = amplitude * Math.sin(2 * Math.PI * freqSignal * t);
                        // Quantification (arrondi au niveau le plus proche)
                        const quantizedValue = Math.round(value / stepSize) * stepSize;
                        // Stocker pour plus tard
                        samplePoints.push({ t, value });
                        quantizedPoints.push({ t, value: quantizedValue });

                        const x = marginX + (t / duration) * plotWidth;
                        const y = zeroY - (value / amplitude) * (plotHeight / 2);
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                } else {
                    // Même stockage sans dessin
                    for (let i = 0; i < numSamples; i++) {
                        const t = i * sampleInterval;
                        const value = amplitude * Math.sin(2 * Math.PI * freqSignal * t);
                        const quantizedValue = Math.round(value / stepSize) * stepSize;
                        samplePoints.push({ t, value });
                        quantizedPoints.push({ t, value: quantizedValue });
                    }
                }

                // Dessiner le signal numérique (escalier) : maintien de la valeur quantifiée jusqu'à l'échantillon suivant
                if (showDigitalCheck.checked && quantizedPoints.length > 0) {
                    ctx.strokeStyle = '#81c784';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    for (let i = 0; i < quantizedPoints.length; i++) {
                        const { t, value } = quantizedPoints[i];
                        const x = marginX + (t / duration) * plotWidth;
                        const y = zeroY - (value / amplitude) * (plotHeight / 2);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                        // Ligne horizontale vers l'échantillon suivant (sauf dernier)
                        if (i < quantizedPoints.length - 1) {
                            const nextT = quantizedPoints[i + 1].t;
                            const nextX = marginX + (nextT / duration) * plotWidth;
                            ctx.lineTo(nextX, y);
                            ctx.moveTo(nextX, y);
                        }
                    }
                    ctx.stroke();
                }

                // Dessiner l'erreur de quantification (optionnel)
                if (showErrorCheck.checked && samplePoints.length > 0) {
                    ctx.fillStyle = 'rgba(229, 115, 115, 0.8)';
                    for (let i = 0; i < samplePoints.length; i++) {
                        const original = samplePoints[i].value;
                        const quantized = quantizedPoints[i].value;
                        const error = original - quantized;
                        const x = marginX + (samplePoints[i].t / duration) * plotWidth;
                        const yOriginal = zeroY - (original / amplitude) * (plotHeight / 2);
                        const yError = zeroY - (error / amplitude) * (plotHeight / 2);
                        ctx.beginPath();
                        ctx.arc(x, yError, 3, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }

                // Légende
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#ffb74d';
                ctx.fillText('— Analogique', marginX + 10, marginY + 15);
                ctx.fillStyle = '#4fc3f7';
                ctx.fillText('• Échantillons', marginX + 10, marginY + 30);
                ctx.fillStyle = '#81c784';
                ctx.fillText('— Numérique', marginX + 10, marginY + 45);
                ctx.fillStyle = '#e57373';
                ctx.fillText('• Erreur', marginX + 10, marginY + 60);
            }

            // Écouteurs d'événements
            freqSignalInput.addEventListener('input', readControls);
            amplitudeInput.addEventListener('input', readControls);
            samplingRateInput.addEventListener('input', readControls);
            bitDepthInput.addEventListener('input', readControls);
            showAnalogCheck.addEventListener('change', draw);
            showSamplesCheck.addEventListener('change', draw);
            showDigitalCheck.addEventListener('change', draw);
            showErrorCheck.addEventListener('change', draw);

            // Redimensionner le canvas pour qu'il soit net sur écran Retina
            function resizeCanvas() {
                const container = canvas.parentElement;
                const containerWidth = container.clientWidth;
                const aspectRatio = 800 / 400;
                const displayHeight = containerWidth / aspectRatio;
                canvas.style.width = containerWidth + 'px';
                canvas.style.height = displayHeight + 'px';
                // Le canvas interne reste 800x400 pour la netteté
                canvas.width = 800;
                canvas.height = 400;
                draw();
            }

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('load', () => {
                updateLabels();
                resizeCanvas();
            });
        })();
    </script>
</body>
</html>
